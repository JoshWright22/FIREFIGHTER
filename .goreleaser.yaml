version: 2
builds:
  - main: ./cmd/firefighter
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    # Keep the symbol table (-w only drops DWARF): fully stripped Go binaries (-s -w) trip
    # Windows Defender's machine-learning detection (Bearfoos.A!ml) on install.
    flags: ["-trimpath"]
    ldflags: ["-w -X main.version={{.Version}}"]
archives:
  - name_template: "firefighter_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
