version: 2
builds:
  - id: firefighter
    main: ./cmd/firefighter
    # Not the project's name (FIREFIGHTER, after the repository): install.sh and the self-updater
    # look for a program called firefighter, and Linux and macOS tell the two apart.
    binary: firefighter
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    # Keep the symbol table (-w only drops DWARF): fully stripped Go binaries (-s -w) look more
    # like packed malware to Windows Defender's machine-learning rules. That alone doesn't settle
    # it: v0.1.0 is flagged by its file's cloud reputation (Bearfoos.A!ml, Colorexe.B,
    # Behavior:Win32/Persistence.A!ml), which only code signing or a false-positive report to
    # Microsoft clears. See docs/security.md.
    flags: ["-trimpath"]
    ldflags: ["-w -X main.version={{.Version}}"]
  # The windowless logon launcher the Run key names (no conhost --headless; security audit
  # 2026-11-22): a GUI-subsystem program, Windows only, in the same zip as firefighter.exe.
  - id: firefighterw
    main: ./cmd/firefighterw
    binary: firefighterw
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: ["-trimpath"]
    ldflags: ["-w -H windowsgui"]
archives:
  - name_template: "firefighter_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
