version: 2
builds:
  - id: firefighter
    main: ./cmd/firefighter
    # Not the project's name (FIREFIGHTER, after the repository): install.sh and the self-updater
    # look for a program called firefighter, and Linux and macOS tell the two apart.
    binary: firefighter
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags: ["-trimpath"]
    ldflags: ["-w -X main.version={{.Version}}"]
    hooks:
      post: bash scripts/use-signed-windows-build.sh "{{ .Path }}" "{{ .Target }}"
  # The Windows Startup shortcut uses this GUI-subsystem launcher when it ships in the archive.
  - id: firefighterw
    main: ./cmd/firefighterw
    binary: firefighterw
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: ["-trimpath"]
    ldflags: ["-w -H windowsgui"]
    hooks:
      post: bash scripts/use-signed-windows-build.sh "{{ .Path }}" "{{ .Target }}"
archives:
  - name_template: "firefighter_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
