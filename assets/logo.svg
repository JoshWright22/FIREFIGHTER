      <stop offset="0.55" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffc94a"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d95"/>
      <stop offset="0.5" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffc94a"/>
