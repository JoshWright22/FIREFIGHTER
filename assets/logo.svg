  </g>
  <text x="180" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="2" fill="url(#word)" filter="url(#glow)">firefighter</text>
  <text x="184" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#b9a8cc" letter-spacing="1">your agents start the fires. you stay the headliner.</text>
