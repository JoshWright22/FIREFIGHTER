name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
# Hosted Windows runners run as an elevated admin; the guard refuses that by default.
env:
  FIREFIGHTER_ALLOW_ELEVATED: "1"
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: unit tests
        shell: bash
        run: |
          race=-race
          [ "$RUNNER_OS-$RUNNER_ARCH" = "Windows-ARM64" ] && race=   # no race detector on windows/arm64
          go test -count=1 $race ./internal/...
      - name: end-to-end tests (real daemon, scripted human and GPU)
        run: go test -count=1 -v -timeout 20m ./cmd/firefighter
      - name: cross-build every target
        shell: bash
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/firefighter || exit 1
          done

  install:
    name: one-command install (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: build (same flags as the release)
        shell: bash
        run: go build -trimpath -ldflags "-w -X main.version=0.0.0-ci" -o "$RUNNER_TEMP/firefighter$([ "$RUNNER_OS" = Windows ] && echo .exe)" ./cmd/firefighter
      - name: Windows Defender finds nothing (a flagged binary is an install-time popup for users)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) { Write-Host 'Defender not on this runner; skipped'; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          $out = & $mp -Scan -ScanType 3 -File (Join-Path $env:RUNNER_TEMP "firefighter.exe") -DisableRemediation 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'found \d+ threat|Threat\s*:') { throw 'Windows Defender flags the build' }
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.claude ~/.codex
          FIREFIGHTER_LOCAL_BINARY="$RUNNER_TEMP/firefighter" sh scripts/install.sh
          export PATH="$HOME/.local/bin:$PATH"
          firefighter version
          firefighter status
          firefighter run --minutes 1 -- sh -c 'echo installed-and-running'
          grep -q "firefighter run" ~/.claude/CLAUDE.md
          grep -q "mcp_servers.firefighter" ~/.codex/config.toml
          firefighter uninstall
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME\.claude","$HOME\.codex" | Out-Null
          $env:FIREFIGHTER_LOCAL_BINARY = "$env:RUNNER_TEMP\firefighter.exe"
          ./scripts/install.ps1
          $env:Path = "$env:LOCALAPPDATA\Programs\firefighter;$env:Path"
          firefighter version
          firefighter status
          firefighter run --minutes 1 -- cmd /c echo installed-and-running
          if (-not (Select-String -Quiet "firefighter run" "$HOME\.claude\CLAUDE.md")) { throw "rules missing" }
          schtasks /Query /TN firefighter
          firefighter uninstall

  vscode:
    name: VS Code extension packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - working-directory: integrations/vscode
        run: |
          node --check extension.js
          npm ci --prefix tools --ignore-scripts && tools/node_modules/.bin/vsce package --no-dependencies -o /tmp/firefighter-vscode.vsix
