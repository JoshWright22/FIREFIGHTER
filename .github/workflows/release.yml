name: release
on:
  push:
    tags: ["v*"]
# Least privilege: only the jobs that publish get write access, and nothing that runs third-party
# npm code holds a write token. Actions are pinned to commit SHAs.
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read         # read the unsigned artifact for SignPath
      contents: write       # create the release and upload assets
      id-token: write       # sign build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false # nothing here pushes: no token left in .git/config
      # The install one-liners install a pinned release, never "latest": the tag must be the one
      # they name (security audit 2026-11-22, H1).
      - name: install scripts are pinned to this tag
        run: |
          grep -qF "else { '${GITHUB_REF_NAME}' }" scripts/install.ps1
          grep -qF 'VERSION="${FIREFIGHTER_VERSION:-'"${GITHUB_REF_NAME}"'}"' scripts/install.sh
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod # the toolchain go.mod names, not whatever "stable" is today
      - name: build artifacts for Windows code signing
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.19.0"
          args: build --clean
      - name: stage Windows executables
        if: vars.SIGNPATH_ENABLED == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/ff-unsigned/$arch" "$RUNNER_TEMP/ff-unsigned-hashes/$arch"
            for binary in firefighter firefighterw; do
              files=(dist/"${binary}_windows_${arch}"*/"$binary.exe")
              if [ "${#files[@]}" -ne 1 ]; then
                echo "Expected one $binary Windows $arch build, found ${#files[@]}" >&2
                exit 1
              fi
              cp -- "${files[0]}" "$RUNNER_TEMP/ff-unsigned/$arch/$binary.exe"
              sha256sum < "${files[0]}" | cut -d ' ' -f 1 > "$RUNNER_TEMP/ff-unsigned-hashes/$arch/$binary.exe.sha256"
            done
          done
      - name: upload unsigned Windows executables
        if: vars.SIGNPATH_ENABLED == 'true'
        id: unsigned-windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-windows
          path: ${{ runner.temp }}/ff-unsigned
          if-no-files-found: error
      - name: sign Windows executables with maintainer approval
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: SignPath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          output-artifact-directory: ${{ runner.temp }}/ff-signed
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "v2.19.0" # exact: this job can publish and sign
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FF_SIGNED_WINDOWS_DIR: ${{ vars.SIGNPATH_ENABLED == 'true' && format('{0}/ff-signed', runner.temp) || '' }}
          FF_UNSIGNED_WINDOWS_HASHES: ${{ runner.temp }}/ff-unsigned-hashes
      # Signed provenance for every archive: `gh attestation verify <file> --repo JoshWright22/FIREFIGHTER`
      # proves it was built by this workflow from this repo, independent of checksums.txt.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
      # The bare binaries, for the MCP bundles (packed below by a job without a write token).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: |
            dist/artifacts.json
            dist/*_amd64*/*
            dist/*_arm64*/*
          if-no-files-found: error
  vscode:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read        # builds with third-party npm code: no write token here
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: package the VS Code extension
        working-directory: integrations/vscode
        run: |
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm ci --prefix tools --ignore-scripts   # vsce and its dependencies from a lockfile
          tools/node_modules/.bin/vsce package --no-dependencies -o firefighter-vscode.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: integrations/vscode/firefighter-vscode.vsix
  mcpb:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read        # runs the mcpb CLI from npm: no write token here
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: dist
      - name: pack one MCP bundle per OS/arch (the registry has no Go type; manifests override per OS only)
        env:
          npm_config_ignore_scripts: "true"
        run: |
          npm ci --ignore-scripts --prefix integrations/mcpb   # mcpb and its dependencies from the lockfile
          node integrations/mcpb/build.mjs stage "${GITHUB_REF_NAME#v}" dist
          for d in dist/mcpb/firefighter_*/; do
            integrations/mcpb/node_modules/.bin/mcpb pack "$d" "dist/mcpb/$(basename "$d").mcpb"
          done
          ls -l dist/mcpb/*.mcpb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcpb
          path: dist/mcpb/*.mcpb
          if-no-files-found: error
  attach:
    needs: [vscode, mcpb]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload one file; runs no third-party code
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpb
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: src           # build.mjs and its inputs (icon, LICENSE); it imports only node: modules
          persist-credentials: false
      # npm code packed the bundles in a job without a write token. Before signing anything, this job
      # stages the same folders itself (plain Node, no dependencies) and requires every bundle to hold
      # exactly those files, byte for byte: the binary, but also manifest.json (what the MCP host
      # launches), the icon and the license, and nothing else (review 11/20).
      - name: each bundle is exactly what build.mjs stages from goreleaser's binaries
        run: |
          set -eu
          # artifacts.json paths are relative to the repo build.mjs runs from: the binaries go under it
          cp -r dist src/dist
          node src/integrations/mcpb/build.mjs stage "${GITHUB_REF_NAME#v}" "$PWD/src/dist"
          for b in firefighter_*.mcpb; do
            d="src/dist/mcpb/${b%.mcpb}"
            [ -d "$d" ] || { echo "$b: no staged folder $d"; exit 1; }
            zipped=$(unzip -Z1 "$b" | grep -v '/$' | sort)
            staged=$(cd "$d" && find . -type f | sed 's|^\./||' | sort)
            [ "$zipped" = "$staged" ] || { echo "$b: files differ from the staged bundle"; echo "zipped: $zipped"; echo "staged: $staged"; exit 1; }
            for f in $staged; do
              want=$(sha256sum "$d/$f" | cut -d' ' -f1)
              got=$(unzip -p "$b" "$f" | sha256sum | cut -d' ' -f1)
              [ "$want" = "$got" ] || { echo "$b: $f differs from the staged copy"; exit 1; }
            done
            echo "$b ok"
          done
      # The extension too was packed by npm code: before it is signed, it must hold exactly the
      # extension's files from this commit (package.json differing only in the version stamped in),
      # plus vsce's two manifest files (review round 6).
      - name: the extension is exactly the repo's files
        run: |
          set -eu
          v=firefighter-vscode.vsix
          want=$(printf '%s\n' '[Content_Types].xml' extension.vsixmanifest extension/LICENSE.txt extension/extension.js extension/icon.png extension/package.json extension/readme.md | sort)
          got=$(unzip -Z1 "$v" | grep -v '/$' | sort)
          [ "$want" = "$got" ] || { echo "$v: unexpected files"; echo "$got"; exit 1; }
          for pair in extension.js:extension.js icon.png:icon.png LICENSE:LICENSE.txt README.md:readme.md; do
            src=src/integrations/vscode/${pair%%:*}; in=extension/${pair##*:}
            [ "$(sha256sum < "$src")" = "$(unzip -p "$v" "$in" | sha256sum)" ] || { echo "$v: $in differs from $src"; exit 1; }
          done
          unzip -p "$v" extension/package.json > packed.json
          node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync("packed.json"));const b=JSON.parse(fs.readFileSync("src/integrations/vscode/package.json"));a.version=b.version="x";const c=o=>Array.isArray(o)?o.map(c):o&&typeof o==="object"?Object.fromEntries(Object.keys(o).sort().map(k=>[k,c(o[k])])):o;if(JSON.stringify(c(a))!==JSON.stringify(c(b))){console.error("package.json differs beyond the version");process.exit(1)}'
          echo "$v ok"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            firefighter-vscode.vsix
            firefighter_*.mcpb
      - name: attach the extension and the MCP bundles to the release
        run: gh release upload "$GITHUB_REF_NAME" firefighter-vscode.vsix firefighter_*.mcpb --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # List the release in the official MCP Registry (registry.modelcontextprotocol.io). Off with the repo
  # variable MCP_REGISTRY_PUBLISH=false; a failure here never fails the release.
  registry:
    needs: attach
    if: startsWith(github.ref, 'refs/tags/v') && vars.MCP_REGISTRY_PUBLISH != 'false'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # GitHub OIDC login to the registry (io.github.JoshWright22/*)
    env:
      MCP_PUBLISHER: v1.8.7
      MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579 # linux_amd64, from registry_1.8.7_checksums.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mcpb
          path: mcpb
      - name: version and sha256 of each bundle into server.json
        run: node integrations/mcpb/build.mjs server-json "${GITHUB_REF_NAME#v}" mcpb && cat server.json
      - name: install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSLo mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
